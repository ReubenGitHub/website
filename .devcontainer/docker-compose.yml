version: '3.8'

# Optional: Use this file to run only dev services
# Usage: docker-compose -f .devcontainer/docker-compose.yml up
# From root: docker-compose -f .devcontainer/docker-compose.yml up

services:
    site-dev:
        build:
            context: ..
            dockerfile: .devcontainer/Dockerfile
        image: mywebsite-dev
        container_name: mywebsite-python-dev
        ports:
            - '5000:5000'
        volumes:
            - ../:/app
            - /app/frontend/node_modules
            - /app/frontend/build
        environment:
            - PYTHONUNBUFFERED=1
            - FLASK_APP=backend/api/api.py
            - STATIC_FOLDER=/app/frontend/build
        depends_on:
            - dotnet-api-dev
        networks:
            - mywebsite-network

    dotnet-api-dev:
        build:
            context: ..
            dockerfile: dotnet/Dockerfile.dev
        image: mywebsite-dotnet-dev
        container_name: mywebsite-dotnet-dev
        ports:
            - '5001:5001'
        volumes:
            - ../dotnet:/src
        environment:
            - ASPNETCORE_URLS=http://+:5001
            - ASPNETCORE_ENVIRONMENT=Development
        networks:
            - mywebsite-network

networks:
    mywebsite-network:
        driver: bridge
